name: Deploy Meta Fatura

on:
  push:
    branches: [main]
    paths:
      - "meta-fatura/**"
      - ".github/workflows/meta-fatura-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          base64 -d meta-fatura/site.tar.gz.b64 > /tmp/meta-fatura.tar.gz
          tar -xzf /tmp/meta-fatura.tar.gz -C _site
          rm -f _site/README.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
